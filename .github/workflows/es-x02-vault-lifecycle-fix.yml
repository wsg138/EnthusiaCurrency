name: ES-X02 Vault Lifecycle Fix

on:
  push:
    branches:
      - package/es-x02-currency-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-x02-currency-provider
          fetch-depth: 0
      - name: Apply fail-closed Vault startup fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/enthusia/enthusiacurrency/EnthusiaCurrencyPlugin.java')
          text = path.read_text(encoding='utf-8')

          old_call = '''        startRuntimeServices();
        setupVault();
        registerCommands();'''
          new_call = '''        startRuntimeServices();
        if (!setupVault()) {
            return;
        }
        registerCommands();'''
          if text.count(old_call) != 1:
              raise SystemExit(f'onEnable Vault call match count={text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          pattern = re.compile(
              r'    private void setupVault\(\) \{\n.*?\n    \}'
              r'(?=\n\n    private void setupPlaceholderAPI)',
              re.DOTALL,
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('setupVault method not found')
          method = match.group(0)
          method = method.replace('private void setupVault()', 'private boolean setupVault()', 1)
          missing = '''            Bukkit.getPluginManager().disablePlugin(this);
            return;'''
          if method.count(missing) != 1:
              raise SystemExit(f'Vault missing branch match count={method.count(missing)}')
          method = method.replace(
              missing,
              '''            Bukkit.getPluginManager().disablePlugin(this);
            return false;''',
              1,
          )
          prefix, suffix = method.rsplit('\n    }', 1)
          method = prefix + '\n        return true;\n    }' + suffix
          text = text[:match.start()] + method + text[match.end():]
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/es-x02-vault-lifecycle-fix.yml
          git diff --check
      - name: Commit lifecycle fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(es-x02): stop startup when Vault is unavailable'
          git push origin HEAD:package/es-x02-currency-provider
