name: ES-X02 Vault Lifecycle Fix

on:
  push:
    branches:
      - package/es-x02-currency-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package/es-x02-currency-provider
          fetch-depth: 0
      - name: Apply fail-closed Vault startup fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/enthusia/enthusiacurrency/EnthusiaCurrencyPlugin.java')
          text = path.read_text(encoding='utf-8')
          old_call = "        startRuntimeServices();\n        setupVault();\n        registerCommands();"
          new_call = "        startRuntimeServices();\n        if (!setupVault()) {\n            return;\n        }\n        registerCommands();"
          if text.count(old_call) != 1:
              raise SystemExit(f'onEnable Vault call match count={text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          start_marker = "    private void setupVault() {"
          end_marker = "\n\n    private void setupPlaceholderAPI()"
          if text.count(start_marker) != 1:
              raise SystemExit(f'setupVault header match count={text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          method = text[start:end]
          method = method.replace(start_marker, "    private boolean setupVault() {", 1)
          missing = "            Bukkit.getPluginManager().disablePlugin(this);\n            return;"
          if method.count(missing) != 1:
              raise SystemExit(f'Vault missing branch match count={method.count(missing)}')
          method = method.replace(missing, "            Bukkit.getPluginManager().disablePlugin(this);\n            return false;", 1)
          close = method.rfind("\n    }")
          if close < 0:
              raise SystemExit('setupVault closing brace not found')
          method = method[:close] + "\n        return true;" + method[close:]
          text = text[:start] + method + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/es-x02-vault-lifecycle-fix.yml
          git diff --check
      - name: Commit lifecycle fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(es-x02): stop startup when Vault is unavailable'
          git push origin HEAD:package/es-x02-currency-provider
