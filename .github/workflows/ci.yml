name: Build, test, and coverage

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: currency-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven Wrapper
        run: chmod +x mvnw && ./mvnw --version

      - name: Verify, test, package, and enforce coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enthusia-currency-test-and-coverage-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: enthusia-currency-plugin
          path: target/enthusia-currency-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Report missing Codacy configuration
        if: ${{ secrets.CODACY_PROJECT_TOKEN == '' }}
        run: echo "Codacy upload skipped because CODACY_PROJECT_TOKEN is not configured for this repository."

      - name: Upload JaCoCo coverage to Codacy
        if: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: target/site/jacoco/jacoco.xml
