config-version: 4

currency:
  material: RAW_GOLD

  block-material: RAW_GOLD_BLOCK
  block-value: 9

  use-name: false
  name: "&6&lGold"

  use-lore: false
  lore:
    - "&7Server currency."

economy:
  starting-balance: 0.0
  allow-decimals: false

  currency-name-singular: "Dollar"
  currency-name-plural: "Dollars"
  currency-symbol: "$"

baltop:
  entries-per-page: 10
  refresh-interval-seconds: 15
  gui:
    enabled: true
    title: "&6Top Balances &7(Page %page%)"

storage:
  flush-interval-seconds: 30
  flush-threshold: 200

leaderboards:
  export:
    # Exports one public all-time board: balance. The export is capped at the top 100 players.
    enabled: true
    board-id: "balance-active-all"
    board-label: "Balance"
    directory: "leaderboards"
    balance-file: "balance.json"
    include-zero-balances: false
    interval-seconds: 60
    debounce-seconds: 10
    r2:
      enabled: false
      endpoint: "https://83982f6d6277634f57d216e6a7f24125.r2.cloudflarestorage.com"
      bucket: "balance-leaderboard"
      index-key: "leaderboards/index.json"
      balance-key: "leaderboards/balance-active-all.json"
      access-key-id: ""
      secret-access-key: ""
      access-key-id-env: "ENTHUSIA_CURRENCY_R2_ACCESS_KEY_ID"
      secret-access-key-env: "ENTHUSIA_CURRENCY_R2_SECRET_ACCESS_KEY"

item-balance:
  debounce-seconds: 2
  stale-after-seconds: 30

item-leaderboard:
  enabled: true
  cache-seconds: 30

item-balance-scan:
  enabled: true
  interval-seconds: 60
  max-players-per-tick: 1
  repair-mode: true
  debug-log-repairs: false

debug:
  performance:
    enabled: false
    log-interval-seconds: 300

integrations:
  plan:
    enabled: true

placeholderapi:
  enabled: true
  # Refreshes the cached top placeholders on a fixed interval instead of recalculating on each request.
  leaderboard-refresh-seconds: 30
  # Maximum rank exposed to placeholders. Supported range is 1-100.
  leaderboard-max-rank: 100
  # Returned when a requested rank does not exist.
  leaderboard-missing-fallback: "N/A"
  # Placeholder formats:
  # %currency_top_balance_<rank>_<field>%
  # %currency_top_bank_<rank>_<field>%
  # %currency_top_items_<rank>_<field>%
  # Fields: name, uuid, value, formatted

analytics:
  enabled: true
  retention-days: 90
  flush-interval-seconds: 10
  flush-threshold: 100
  shutdown-flush-timeout-seconds: 10

placeholders:
  cache-seconds: 30

messages:
  prefix: "&8[&6Currency&8] &r"

  no-permission: "&cYou don't have permission to do that."
  player-only: "&cOnly players can run this command."
  invalid-amount: "&cPlease enter a valid amount."
  player-not-found: "&cThat player has never joined before."
  self-pay: "&cYou can't pay yourself."

  not-enough-funds: "&cYou don't have the funds for that. &7Balance: &a%symbol%%have% %currency%"
  not-enough-items: "&cYou don't have enough %currency_plural% in item form."

  deposit-success: "&aDeposited &e%symbol%%amount% %currency% &ainto your account."
  deposit-all-success: "&aDeposited all your %currency_plural% (&e%symbol%%amount%&a)."

  withdraw-success: "&aWithdrew &e%symbol%%amount% %currency% &ainto physical form."
  inventory-full: "&cYour inventory is full. Please free some space before withdrawing."

  pay-success-sender: "&aYou paid &e%target% &e%symbol%%amount% %currency%&a."
  pay-success-target: "&aYou received &e%symbol%%amount% %currency% &afrom &e%sender%&a."
  pay-received-offline: "&aWhile you were offline, &e%sender% &asent you &e%symbol%%amount% %currency%&a."

  balance-self: "&aYour balance: &e%symbol%%total% %currency_plural% &7(&fbank: &e%symbol%%bank%&7, items: &e%symbol%%items%&7)"
  balance-other: "&a%target%'s balance: &e%symbol%%total% %currency_plural% &7(&fbank: &e%symbol%%bank%&7, items: &e%symbol%%items%&7)"

  reloaded: "&aEnthusiaCurrency config reloaded."

  baltop-header: "&6&lTop Balances &7(Page %page%)"
  baltop-entry: "&e#%pos% &f%player% &7- &e%symbol%%amount%"

  baltop-no-data: "&7No balances found."
